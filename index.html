.mnt{display:flex;align-items:center;gap:10px;background:#dbe9fb;color:#111;border-radius:8px;padding:10px 12px;margin:0 0 10px}.mnt>div{flex:1}.mnt label{font-weight:700;font-size:15px;display:block;margin:0;color:#111}.mnt .mh{font-size:12px;color:#333;margin-top:2px}.mnt input{width:84px;text-align:center;font-size:20px;font-weight:700;padding:8px}.mq{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:0 0 12px}.gr .vd small{color:#fff}.gr .vy small{color:#111}

.gp label.fbtn{color:#fff;display:inline-block;font-size:11px;margin:0}

.gr div.rg,.gr div.rn{flex-wrap:wrap}
.gr small{font-size:11px;font-weight:400;color:#555}

.gb.gb2{grid-template-columns:1.25fr 1fr}

.tabs{display:flex;gap:6px;margin:0 0 10px}

.pill.rd{border-color:#d93025;background:#fadcd9}
.cmpcard{display:none}
.cmpcard.on{display:block}
.cmptitle{font-weight:700;margin:2px 0 6px;color:#fff;font-size:15px}
#cmpList .late,#cmpList .mnt,#cmpList .mq,#cmpList .gr,#cmpList .bar2,#cmpList .gb1,#cmpList .bar:not(.cmpact){display:none}
.cmpact{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.cmpgo{background:#7c3aed}
.rc{background:#7c3aed;color:#fff;font-size:11px;padding:2px 7px;border-radius:10px;margin-left:6px;white-space:nowrap}
.x3{display:grid;grid-template-columns:1.5fr 1fr 1fr;gap:1px;margin-top:6px}
.x3 input,.g3 input{padding:13px 6px;height:auto;color:#111}
.x3 .lab{padding:10px 4px;text-align:center}
.x3 .sp{grid-column:span 2}
.xr{background:var(--cell);color:#111;text-align:center;padding:12px 2px;font-size:15px;display:flex;align-items:center;justify-content:center;flex-direction:column;min-height:20px}
.xr.b{font-weight:700;font-size:20px}
.xr.g{background:var(--green)}
.xr small{font-weight:400;font-size:11px;color:#333;margin-top:2px}
.xhd{font-size:10px}
.in.bk,.in.bk input{background:#a6d8ff}
.in.ly,.in.ly input{background:#f9b4c4}
.hd.bkh{background:#72bbef;color:#111}
.hd.lyh{background:#f08ca4;color:#111}
.xr small.vp{padding:2px 7px;border-radius:9px;font-weight:700;margin-top:4px}
.xr small.vp.v1{background:#0a7a2f;color:#fff}

.g3.two{grid-template-columns:repeat(2,1fr)}
.mqb{background:#7c3aed;padding:9px 14px;font-size:14px}
</style>
</head>
<body>
<div class="wrap">
  <div class="tabs"><button class="tab on" id="tabCalc">Kalkulator</button><button class="tab" id="tabCmp">Porównanie meczów</button><button class="tab" id="tabX12">1x2</button></div>
  <div id="cmp" style="display:none">
    <div id="cmpRec" class="rec wait"></div>
    <div id="cmpPills" class="pills"></div>
    <div id="cmpList"></div>
    <div class="bar"><button id="cmpClear" class="reset">Wyczyść karty</button><button id="cmpSaveAll">Zapisz wszystkie mecze</button></div>
  </div>
  <div id="x12" style="display:none"></div>
  <div id="calcTab">
  <div id="list"></div>
  
  <div class="gp logbox"><div class="gh">Mecze i uczenie się</div><div id="msg" class="lnote"></div><div id="cnt"></div><div id="cal"></div><div class="sec">Zapisane mecze</div><div id="lg"></div><div class="sec" style="background:linear-gradient(90deg,#12803a,#0b6fd6)">Zapisane mecze 1x2 (uczenie się wyniku 1 / X / 2)</div><div id="x12lg"></div><div class="sec" style="background:linear-gradient(90deg,#7c3aed,#12803a)">Statystyki</div><div id="stat"></div><div class="bar"><button id="dl">Zapisz mecze do pliku</button><label class="fbtn" for="impf">Wczytaj mecze z pliku</label><input type="file" id="impf" class="vh"><button class="rm" id="clr">Wyczyść wszystko</button></div><textarea id="csvbox" readonly aria-label="Mecze jako tekst CSV"></textarea><div id="msg2" class="lnote"></div><details id="pasteBox"><summary>Nie działa wczytywanie z pliku? Wklej tekst</summary><textarea id="pst" placeholder="Wklej tu całą zawartość pliku z meczami"></textarea><button id="pbtn">Wczytaj z wklejonego tekstu</button></details></div>
</div>
</div>
<div id="toast"></div>
<p class="lnote" style="text-align:center;margin:8px 0 24px">Wersja kalkulatora: 19.10 (v37)</p>
<script>
var list=document.getElementById('list');
var LOG=[],DB=null,UID=null,busy=false,busyAt=0,again=false,SYN={};
var toastT=0;
var X12=[];try{X12=JSON.parse(localStorage.getItem('xgx12')||'[]')}catch(e){X12=[]}
var XC=[1,0,0],XLAST=null;
function persistX(){try{localStorage.setItem('xgx12',JSON.stringify(X12))}catch(e){}
  if(DB&&UID){try{DB.collection('data/users/'+UID).doc('x12log').set({entries:JSON.parse(JSON.stringify(X12))}).catch(function(){setMsg('Nie udało się zapisać meczów 1x2 na koncie')})}catch(e){}}}
function xres(){return X12.filter(function(e){return e.r})}
function xlg(p){return p.map(function(v){return Math.log(Math.max(1e-6,v))})}
function xapply(c,p){var l=xlg(p),z=[c[0]*l[0],c[0]*l[1]+c[1],c[0]*l[2]+c[2]],m=Math.max(z[0],z[1],z[2]),e=z.map(function(v){return Math.exp(v-m)}),s=e[0]+e[1]+e[2];return[e[0]/s,e[1]/s,e[2]/s]}
function fitX(){var d=xres(),c=[1,0,0],lam=4,i,k;XC=[1,0,0];if(!d.length)return;
  var L=d.length*12+lam+1;
  for(var it=0;it<400;it++){var g=[lam*(c[0]-1),lam*c[1],lam*c[2]];
    for(i=0;i<d.length;i++){var e=d[i],q=xapply(c,e.p),l=xlg(e.p),y=[e.r==='1'?1:0,e.r==='X'?1:0,e.r==='2'?1:0];
      g[0]+=(q[0]-y[0])*l[0]+(q[1]-y[1])*l[1]+(q[2]-y[2])*l[2];g[1]+=q[1]-y[1];g[2]+=q[2]-y[2]}
    for(k=0;k<3;k++)c[k]-=g[k]/L}
  XC=c}
function renderX12(){var el=document.getElementById('x12lg');if(!el)return;
  var d=xres(),hit=d.filter(function(e){return e.r===e.pk}).length,mo=X12.filter(function(e){return e.ok===true||e.ok===false}),mok=mo.filter(function(e){return e.ok}).length;
  var h='<div class="gr">'+R('Zapisane mecze 1x2',X12.length)+R('Z wynikiem końcowym',d.length)+R('Najwyższy procent trafił',d.length?hit+' z '+d.length+' ('+Math.round(hit/d.length*100)+'%)':'-')+R('Prognoza trafna (Twój wybór)',mo.length?mok+' z '+mo.length+' ('+Math.round(mok/mo.length*100)+'%)':'-')+R('Uczenie się',d.length?'włączone (liczba meczów: '+d.length+')':'zacznie się po pierwszym wyniku')+'</div>';
  var rows='',sel=function(c){return c?' style="outline:3px solid #111"':''};
  for(var i=X12.length-1;i>=0;i--){var e=X12[i],mx=Math.max(e.q[0],e.q[1],e.q[2]),cls=e.ok===true?'rg':(e.ok===false?'rn':'');
    rows+='<div'+(cls?' class="'+cls+'"':'')+'><span style="flex-basis:100%"><b>'+esc(e.n)+'</b> · min. '+e.m+' · wynik '+esc(e.sc)+'<br><small>Najwyższy: '+e.pk+' ('+Math.round(mx*100)+'%) · '+esc(e.bet)+'</small></span>'
    +'<span>Prognoza trafna:<button class="lb yes" data-xi="'+i+'" data-xa="ok1"'+sel(e.ok===true)+'>Tak</button><button class="lb no" data-xi="'+i+'" data-xa="ok0"'+sel(e.ok===false)+'>Nie</button></span>'
    +'<span>Wynik meczu:'+['1','X','2'].map(function(c){return '<button class="lb" data-xi="'+i+'" data-xa="'+c+'"'+sel(e.r===c)+'>'+c+'</button>'}).join('')+'<button class="lb xx" data-xi="'+i+'" data-xa="x">x</button></span></div>'}
  el.innerHTML=h+(rows?'<p class="lnote">Zaznacz, czy prognoza była trafna, a niżej, jak naprawdę skończył się mecz (1, X lub 2). Kalkulator uczy się z tego wyniku.</p><div class="gr">'+rows+'</div>':'<p class="lnote">Brak zapisanych meczów 1x2. Zapisz mecz przyciskiem w zakładce 1x2.</p>')}
(function(){var el=document.getElementById('x12lg');if(!el)return;el.onclick=function(ev){var t=ev.target,i=t.dataset&&t.dataset.xi;if(i===undefined)return;i=+i;var e=X12[i],a=t.dataset.xa;if(!e)return;
  if(a==='x')X12.splice(i,1);else if(a==='ok1')e.ok=true;else if(a==='ok0')e.ok=false;else{e.r=a;if(e.ok===null||e.ok===undefined)e.ok=(e.pk===a)}
  persistX();renderLog()}})();
function setMsg(t){var m=document.getElementById('msg'),m2=document.getElementById('msg2'),to=document.getElementById('toast');if(m)m.textContent=t;if(m2)m2.textContent=t;if(to){to.textContent=t;to.style.display='block';clearTimeout(toastT);toastT=setTimeout(function(){to.style.display='none'},2800)}}
try{LOG=JSON.parse(localStorage.getItem('xglog')||'[]')}catch(e){LOG=[]}
var GM={};try{GM=JSON.parse(localStorage.getItem('xggm')||'{}')}catch(e){GM={}}
function gmOf(e){return GM[e.t]||e.gm||0}
function persistGM(){
  try{localStorage.setItem('xggm',JSON.stringify(GM))}catch(e){}
  if(DB&&UID){try{DB.collection('data/users/'+UID).doc('gmmap').set({map:JSON.parse(JSON.stringify(GM))}).catch(function(){setMsg('Nie udało się zapisać minut na koncie')})}catch(e){}}
}
function dbNote(){return (typeof claude!=='undefined'&&!(DB&&UID))?' (tylko w tej przeglądarce, bez konta)':''}
function saveLog(){
  try{localStorage.setItem('xglog',JSON.stringify(LOG))}catch(e){}
  if(!DB||!UID)return;
  var nowT=Date.now();if(busy&&nowT-busyAt<10000){again=true;return}
  busy=true;busyAt=nowT;
  var col=DB.collection('data/users/'+UID),ops=[],keys={};
  LOG.forEach(function(e){
    var k='m_'+e.t,j=JSON.stringify(e);keys[k]=1;
    if(SYN[k]!==j)ops.push(col.doc(k).set(JSON.parse(j)).then(function(){SYN[k]=j}));
  });
  Object.keys(SYN).forEach(function(k){
    if(!keys[k])ops.push(col.doc(k).delete().then(function(){delete SYN[k]}));
  });
  Promise.all(ops).catch(function(){setMsg('Nie udało się zsynchronizować z kontem, zapisano tylko na tym urządzeniu')}).then(function(){busy=false;if(again){again=false;saveLog()}});
}
var P0=[0,1,0,0,0,0,0],TH=P0.slice(),NLEARN=0;

function cell(x,mx,o){return '<div class="xr b'+(x.p===mx?' g':'')+'">'+pc(x.p)+'<small>uczciwy kurs '+od(x.p)+'</small>'+(ok(o)?'<small class="vp '+(x.p*o-1>=0.01?'v1':'v0')+'">'+valTxt(x.p,o)+' (kurs '+o.toFixed(2)+')</small>':'')+'</div>'}
var mxS=Math.max(p1,px,p2),mxD=Math.max(fo[3].p,fo[4].p,fo[5].p);var DO={};op.forEach(function(x){if(x.t=='d')DO[x.k.replace('Back ','')]=x.o});
var hh='<div class="g3"><div class="hd xhd">1 '+nm1+'</div><div class="hd xhd">X remis</div><div class="hd xhd">2 '+nm2+'</div>'+cell(fo[0],mxS,B1)+cell(fo[1],mxS,BX)+cell(fo[2],mxS,B2)+'</div>';
hh+='<div class="g3"><div class="hd">1X</div><div class="hd">X2</div><div class="hd">12</div>'+cell(fo[3],mxD,DO['1X'])+cell(fo[4],mxD,DO['X2'])+cell(fo[5],mxD,DO['12'])+'</div>';
function cc2(lbl,p){return '<div class="xr b'+(p>=0.5?' g':'')+'"><span style="font-size:11px;font-weight:600">'+lbl+'</span>'+pc(p)+'<small>uczciwy kurs '+od(p)+'</small></div>'}
hh+='<div class="g3 two"><div class="hd" style="grid-column:1/-1">Gole w całym meczu: powyżej / poniżej 2,5</div>'+cc2('Over 2,5',pO25)+cc2('Under 2,5',1-pO25)+'</div>';
hh+='<div class="g3 two"><div class="hd" style="grid-column:1/-1">Oba zespoły strzelą (BTTS)</div>'+cc2('Tak',pBT)+cc2('Nie',1-pBT)+'</div>';
hh+='<div class="g3"><div class="hd" style="grid-column:1/-1">3 najbardziej prawdopodobne wyniki końcowe</div>'+sc.map(function(x,ix){return '<div class="xr b'+(ix==0?' g':'')+'">'+x.k+'<small>'+(x.p*100).toFixed(1)+'% · kurs '+od(x.p)+'</small></div>'}).join('')+'</div>';
var rc='rec',tt='',sb='';
var sing=fo.slice(0,3).sort(function(a,b){return b.p-a.p})[0],dc=fo.slice(3).sort(function(a,b){return b.p-a.p})[0];
if(hasO){var bs=op.filter(function(x){return x.e>=0.05&&(x.t=='l'?1-x.p>=0.55:x.p>=(x.t=='b'?0.30:0.55))}).sort(function(a,b){return b.e-a.e})[0];
if(bs){rc='rec ok';tt='Warto postawić '+bs.k+(bs.src?' ('+bs.src+')':'');sb=(bs.t=='l'?'Szansa tego wyniku '+pc(bs.p)+', lay wygrywa przy '+pc(1-bs.p):'Szansa '+pc(bs.p))+' · uczciwy kurs '+od(bs.p)+' · kurs '+bs.o.toFixed(2)+' · przewaga +'+Math.round(bs.e*100)+'% (bez prowizji Betfair)'}
else{rc='rec no';tt='Brak wartości: lepiej nie obstawiać';sb='Najbardziej prawdopodobne: '+sing.k+' ('+pc(sing.p)+'), ale kursy tego nie opłacają.'}}
else{tt='Najbardziej prawdopodobne: '+sing.k+' ('+pc(sing.p)+')';sb='Bezpieczniej: '+dc.k+' ('+pc(dc.p)+'). Wpisz kursy Back i Lay (niebieskie i różowe pola), żeby sprawdzić czy zakład ma wartość.'}
hh+='<div class="'+rc+'" style="margin-top:8px"><b>'+tt+'</b>'+sb+'</div>';
var pkI=AD[0]>=AD[1]&&AD[0]>=AD[2]?0:(AD[1]>=AD[2]?1:2);
XLAST={n:(root.querySelector('#x12-n1').value.trim()||'Gosp.')+' - '+(root.querySelector('#x12-n2').value.trim()||'Goście'),m:Math.round(m),sc:sh+':'+sa,p:RW,q:AD,pk:['1','X','2'][pkI],bet:tt};
if(NX)hh+='<p class="lnote">Szanse skorygowane na podstawie '+NX+' zapisanych meczów z wynikiem.</p>';
if(wr.length)hh+='<div class="wrn">'+wr.map(function(x){return '<p>'+x+'</p>'}).join('')+'</div>';
if(hasO){hh+='<div class="gp"><div class="gh">Wartość zakładów (szansa wyniku · kurs · przewaga, bez prowizji)</div><div class="gr">'+op.map(function(x){return R(x.k+(x.src?' ('+x.src+')':''),pc(x.p)+' · '+x.o.toFixed(2)+' · '+(x.e>=0?'+':'')+Math.round(x.e*100)+'%',x.e>=0.05?'ok':'')}).join('')+'</div></div>'}
o.innerHTML=hh}
root.addEventListener('input',function(ev){var id=ev.target.id;if(id!=='x12-pos1'&&id!=='x12-pos2')return;
  var o2=root.querySelector('#x12-pos'+(id==='x12-pos1'?'2':'1')),v=parseFloat(String(ev.target.value).replace(',','.'));
  if(ev.target.value.trim()===''){o2.value='';return}
  if(isNaN(v)||v<0||v>100)return;o2.value=String(Math.round((100-v)*10)/10)});
root.addEventListener('input',run);
function saveX12(quiet){
  if(!XLAST){if(!quiet)setMsg('Najpierw wpisz minutę meczu');return false}
  var e=JSON.parse(JSON.stringify(XLAST));
  if(X12.some(function(y){return y.n===e.n&&y.m===e.m&&y.sc===e.sc&&Date.now()-y.t<86400000})){if(!quiet)setMsg('Ten mecz z tą minutą i wynikiem już zapisano');return false}
  e.t=Date.now();e.ok=null;e.r=null;X12.push(e);persistX();renderLog();
  if(!quiet)setMsg('Zapisano mecz 1x2: '+e.n+'. Znajdziesz go w zakładce Kalkulator, w zapisanych meczach 1x2.');
  return true}
root.addEventListener('click',function(ev){
  if(ev.target.id==='x12-save'){saveX12();return}});
root.querySelector('#x12-clr').onclick=function(){root.querySelectorAll('input').forEach(function(e){e.value=''});run()};
run();
})();
</script>
