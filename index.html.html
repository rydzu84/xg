<body>
<div class="wrap">
  <div id="list"></div>
  
  <div class="gp logbox"><div class="gh">Mecze i uczenie się</div><div id="msg" class="lnote"></div><div id="cnt"></div><div id="cal"></div><div class="sec">Zapisane mecze</div><div id="lg"></div><div class="sec s70">Sprawdzenia w trakcie 2. połowy (gol od wpisanej minuty)</div><div id="lcnt"></div><div id="llg"></div><div class="bar"><button id="dl">Zapisz mecze do pliku</button><label class="fbtn" for="impf">Wczytaj mecze z pliku</label><input type="file" id="impf" class="vh"><button class="rm" id="clr">Wyczyść wszystko</button></div><textarea id="csvbox" readonly aria-label="Mecze jako tekst CSV"></textarea><div id="msg2" class="lnote"></div><details id="pasteBox"><summary>Nie działa wczytywanie z pliku? Wklej tekst</summary><textarea id="pst" placeholder="Wklej tu całą zawartość pliku z meczami"></textarea><button id="pbtn">Wczytaj z wklejonego tekstu</button></details></div>
</div>
<div id="toast"></div>
<p class="lnote" style="text-align:center;margin:8px 0 24px">Wersja kalkulatora: 13.10 (v23)</p>
<script>
var list=document.getElementById('list');
var LOG=[],DB=null,UID=null,busy=false,busyAt=0,again=false,SYN={};
var toastT=0;
function setMsg(t){var m=document.getElementById('msg'),m2=document.getElementById('msg2'),to=document.getElementById('toast');if(m)m.textContent=t;if(m2)m2.textContent=t;if(to){to.textContent=t;to.style.display='block';clearTimeout(toastT);toastT=setTimeout(function(){to.style.display='none'},2800)}}
try{LOG=JSON.parse(localStorage.getItem('xglog')||'[]')}catch(e){LOG=[]}
var GM={};try{GM=JSON.parse(localStorage.getItem('xggm')||'{}')}catch(e){GM={}}
function gmOf(e){return GM[e.t]||e.gm||0}
function persistGM(){
  try{localStorage.setItem('xggm',JSON.stringify(GM))}catch(e){}
  if(DB&&UID){try{DB.collection('data/users/'+UID).doc('gmmap').set({map:JSON.parse(JSON.stringify(GM))}).catch(function(){setMsg('Nie udało się zapisać minut na koncie')})}catch(e){}}
}
function dbNote(){return (typeof claude!=='undefined'&&!(DB&&UID))?' (tylko w tej przeglądarce, bez konta)':''}
function saveLog(){
  try{localStorage.setItem('xglog',JSON.stringify(LOG))}catch(e){}
  if(!DB||!UID)return;
  var nowT=Date.now();if(busy&&nowT-busyAt<10000){again=true;return}
  busy=true;busyAt=nowT;
  var col=DB.collection('data/users/'+UID),ops=[],keys={};
  LOG.forEach(function(e){
    var k='m_'+e.t,j=JSON.stringify(e);keys[k]=1;
    if(SYN[k]!==j)ops.push(col.doc(k).set(JSON.parse(j)).then(function(){SYN[k]=j}));
  });
  Object.keys(SYN).forEach(function(k){
    if(!keys[k])ops.push(col.doc(k).delete().then(function(){delete SYN[k]}));
  });
  Promise.all(ops).catch(function(){setMsg('Nie udało się zapisać')}).then(function(){busy=false;if(again){again=false;saveLog()}});
}
var P0=[0,1,0,0,0,0,0],TH=P0.slice(),NLEARN=0;
function sg(x){return 1/(1+Math.exp(-x))}
function R(a,b,c){return '<div'+(c?' class="'+c+'"':'')+'><span>'+a+'</span><span>'+b+'</span></div>'}
function resolved(){return LOG.filter(function(e){return e.o!==null&&e.k!=='late'})}
function featOf(e){var f=e.f;if(f&&f.length===6)return f;if(f&&f.length===4)return f.concat([0,0]);var p=Math.min(0.999,Math.max(0.001,e.p));return[Math.log(p/(1-p)),0,0,0,0,0]}
function fit(d,iters){
  var th=P0.slice(),lam=4;
  if(!d.length)return th;
  var L=0.25*d.length*10+lam+1,X=d.map(function(e){return[1].concat(featOf(e))}),Y=d.map(function(e){return e.o?1:0});
  for(var it=0;it<iters;it++){
    var g=th.map(function(v,k){return lam*(v-P0[k])});
    for(var i=0;i<X.length;i++){var z=0,k;for(k=0;k<7;k++)z+=th[k]*X[i][k];var r=sg(z)-Y[i];for(k=0;k<7;k++)g[k]+=r*X[i][k]}
    for(var j=0;j<7;j++)th[j]-=g[j]/L;
  }
  return th;
}
var PL=[0,0.5,0,0.5],TL=PL.slice(),NLEARNL=0;
function resolvedL(){return LOG.filter(function(e){return e.o!==null&&e.k==='late'})}
function featL(e){var f=e.f;if(f&&f.length===3)return f;if(f&&f.length===2)return[f[0],f[1],f[0]];var p=Math.min(0.999,Math.max(0.001,e.p)),l=Math.log(p/(1-p));return[l,0,l]}
function fitL(d,iters){
  var th=PL.slice(),lam=4;
  if(!d.length)return th;
  var L=0.25*d.length*5+lam+1,X=d.map(function(e){return[1].concat(featL(e))}),Y=d.map(function(e){return e.o?1:0});
  for(var it=0;it<iters;it++){
    var g=th.map(function(v,k){return lam*(v-PL[k])});
    for(var i=0;i<X.length;i++){var z=0,k;for(k=0;k<4;k++)z+=th[k]*X[i][k];var r=sg(z)-Y[i];for(k=0;k<4;k++)g[k]+=r*X[i][k]}
    for(var j=0;j<4;j++)th[j]-=g[j]/L;
  }
  return th;
}
function predL(f){return sg(TL[0]+TL[1]*f[0]+TL[2]*f[1]+TL[3]*f[2])}
function train(){var d=resolved();NLEARN=d.length;TH=fit(d,300);var dl=resolvedL();NLEARNL=dl.length;TL=fitL(dl,300)}
function pred(th,f){var z=th[0];for(var k=0;k<6;k++)z+=th[k+1]*f[k];return sg(z)}
function predict(f){return pred(TH,f)}
function invM(A){
  var n=A.length,M=A.map(function(r,i){var row=r.slice();for(var j=0;j<n;j++)row.push(i===j?1:0);return row});
  for(var c=0;c<n;c++){
    var p=c;for(var r=c+1;r<n;r++)if(Math.abs(M[r][c])>Math.abs(M[p][c]))p=r;
    var t=M[c];M[c]=M[p];M[p]=t;
    var d=M[c][c];if(Math.abs(d)<1e-12)return null;
    for(var j=0;j<2*n;j++)M[c][j]/=d;
    for(var r2=0;r2<n;r2++){if(r2===c)continue;var f=M[r2][c];if(f)for(var j2=0;j2<2*n;j2++)M[r2][j2]-=f*M[c][j2]}
  }
  return M.map(function(r){return r.slice(n)});
}
function ciLogit(X,th,f,lam){
  var n=f.length,H=[];
  for(var i=0;i<n;i++){H.push([]);for(var j=0;j<n;j++)H[i].push(i===j?lam:0)}
  X.forEach(function(x){var z=0;for(var k=0;k<n;k++)z+=th[k]*x[k];var p=sg(z),w=p*(1-p);for(var i=0;i<n;i++)for(var j=0;j<n;j++)H[i][j]+=w*x[i]*x[j]});
  var S=invM(H);if(!S)return null;
  var v=0;for(var i2=0;i2<n;i2++)for(var j2=0;j2<n;j2++)v+=f[i2]*S[i2][j2]*f[j2];
  var z0=0;for(var k2=0;k2<n;k2++)z0+=th[k2]*f[k2];
  var sd=Math.sqrt(Math.max(0,v));
  return [sg(z0-1.28*sd),sg(z0+1.28*sd)];
}
function ciHT(f){var d=resolved();return ciLogit(d.map(function(e){return[1].concat(featOf(e))}),TH,[1].concat(f),4)}
function ciLT(f){var d=resolvedL();return ciLogit(d.map(function(e){return[1].concat(featL(e))}),TL,[1].concat(f),4)}
function ciTxt(c){return c?' <small>(zakres '+Math.round(c[0]*100)+'\u2013'+Math.round(c[1]*100)+'%)</small>':''}
function winW(){
  var c=[3.1,3.3,3.6],seen={},n=0;
  LOG.forEach(function(e){
    if(e.o!==true)return;var g=gmOf(e);if(!(g>45))return;
    var k=new Date(e.t).toISOString().slice(0,10)+'|'+e.n;if(seen[k])return;seen[k]=1;
    c[g<=60?0:(g<=75?1:2)]++;n++;
  });
  var sum=c[0]+c[1]+c[2];
  return{w:[c[0]/sum,c[1]/sum,c[2]/sum],n:n};
}
function cum2(t){
  var w=winW().w;
  if(t<=45)return 0;if(t>=90)return 1;
  if(t<=60)return w[0]*(t-45)/15;
  if(t<=75)return w[0]+w[1]*(t-60)/15;
  return w[0]+w[1]+w[2]*(t-75)/15;
}
function nrm(s){return String(s||'').trim().toLowerCase()}
function teamsOf(e){if(e.h!==undefined)return[nrm(e.h),nrm(e.a)];var p=String(e.n||'').split(' - ');return[nrm(p[0]),nrm(p[1])]}
function hist(n1,n2){
  var a=nrm(n1),b=nrm(n2),A={n:0,g:0},B={n:0,g:0},T={n:0,g:0};
  resolved().forEach(function(e){
    var t=teamsOf(e),ia=a&&(t[0]===a||t[1]===a),ib=b&&(t[0]===b||t[1]===b);
    if(ia){A.n++;if(e.o)A.g++}
    if(ib){B.n++;if(e.o)B.g++}
    if(ia||ib){T.n++;if(e.o)T.g++}
  });
  return{A:A,B:B,T:T};
}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function resText(x){if(x.o===null)return 'Czeka na wynik';if(!x.o)return 'Brak gola w 2. połowie';return 'Gol w 2. połowie ('+(gmOf(x)?gmOf(x)+'. minuta':'minuta nieznana')+')'}
function csv(kind){
  var rows=[['data','mecz','wynik_w_przerwie','xg_pierwsza_polowa','kurs_over25','kurs_under25','czerwone_kartki','szansa_przerwa_procent','minuta_sprawdzenia','szansa_sprawdzenie_procent','wynik_2_polowa']];
  var groups={},order=[];
  LOG.forEach(function(e){var k=new Date(e.t).toISOString().slice(0,10)+'|'+e.n;if(!groups[k]){groups[k]={ht:null,lt:null};order.push(k)}if(e.k==='late')groups[k].lt=e;else groups[k].ht=e});
  order.forEach(function(k){
    var g=groups[k],h=g.ht,l=g.lt,a=h||l,res=(l&&l.o!==null)?l:((h&&h.o!==null)?h:a);
    var pick=function(f){var v=(h&&h[f])?h[f]:((l&&l[f])?l[f]:'');return v===''?'':Math.round(v*100)/100};
    rows.push([k.split('|')[0],a.n,a.sc,pick('mx'),pick('ov'),pick('un'),(h?h.rd:(l?l.rd:0))||0,h?(h.p*100).toFixed(1):'',l?l.m:'',l?(l.p*100).toFixed(1):'',resText(res)]);
  });
  return '\ufeff'+rows.map(function(r){return r.map(function(c){return '"'+String(c).replace(/"/g,'""')+'"'}).join(',')}).join('\n');
}
function renderLog(){

    var r1n=Math.floor(num(q('.r1').value)),r2n=Math.floor(num(q('.r2').value)),reds=r1n+r2n;
    var shr=obs>0?xhO/obs:0.5,rem0=tot*(1-Fm)*mom;
    var lamH=rem0*shr*Math.pow(0.75,r1n)*Math.pow(1.25,r2n),lamA=rem0*(1-shr)*Math.pow(0.75,r2n)*Math.pow(1.25,r1n);
    var gd=s1-s2,ad=Math.abs(gd),lf=1,tf=1;
    if(ad>=3){lf=0.80;tf=0.90}else if(ad>=1){lf=0.95;tf=1.10}
    var gH=gd>0?lf:(gd<0?tf:1),gA=gd<0?lf:(gd>0?tf:1);
    lamH*=gH;lamA*=gA;
    var rem=lamH+lamA;
    var p0=Math.exp(-rem),p1=rem*p0,p2=rem*rem/2*p0;
    var pg=1-p0;
    var ps=0,pmk=0;
    
    var lov=num(q('.lo').value),lun=num(q('.lu').value);
    if(lov>1&&lun>1)pmk=(1/lov)/(1/lov+1/lun);else if(lov>1)pmk=Math.min(0.98,(1/lov)/1.05);
    function lgt(x){x=Math.min(0.995,Math.max(0.005,x));return Math.log(x/(1-x))}
    var wm=pmk>0?0.5:0,ws=ps>0?0.2:0;
    var pb=(wm+ws>0)?sg((1-wm-ws)*lgt(pg)+wm*lgt(pmk)+ws*lgt(ps)):pg;
    var pq=Math.min(0.999,Math.max(0.001,pb));
    var H=hist(q('.n1').value,q('.n2').value);
    var hr=(H.T.g+3)/(H.T.n+4),hs=H.T.n>0?Math.log(hr/(1-hr))-Math.log(3):0;
    var fv=[Math.log(pq/(1-pq)),mx-1.2,oddsL>0?oddsL-2.7:0,reds,Math.min(3,ad)-1,hs];
    var pc=pb,cb=false;
    if(NLEARN>0){pc=predict(fv);cb=true}
    function pois(l,n){var p=[Math.exp(-l)];for(var k=1;k<=n;k++)p.push(p[k-1]*l/k);return p}
    var qh=pois(lamH,12),qa=pois(lamA,12),w1=0,wx=0,w2=0,fs={};
    for(var gi=0;gi<=12;gi++)for(var gj=0;gj<=12;gj++){var pp=qh[gi]*qa[gj],hg=s1+gi,ag=s2+gj;fs[hg+'-'+ag]=pp;if(hg>ag)w1+=pp;else if(hg==ag)wx+=pp;else w2+=pp}
    q('.rs').innerHTML='1&nbsp;'+(w1*100).toFixed(0)+'% X&nbsp;'+(wx*100).toFixed(0)+'% 2&nbsp;'+(w2*100).toFixed(0)+'%';
    var setT=function(sel,txt,hi){var el=q(sel);if(el){el.textContent=txt;if(hi!==undefined)el.classList.toggle('g',hi)}};
    setT('.pn0',((1-pc)*100).toFixed(0)+'%');
    var cih=ciHT(fv),mpEl=q('.mp');
    if(mpEl){
      var need=lov>1?1/lov:0,mpCls='';
      var dlt=need>0?pc-need:1;

      mpEl.innerHTML='<div><b>'+(pc*100).toFixed(1)+'%</b>'+(cih?'<small>zakres '+Math.round(cih[0]*100)+'\u2013'+Math.round(cih[1]*100)+'%</small>':'')+'<small>uczciwy kurs '+(pc>0.0005?(1/pc).toFixed(2):'-')+'</small>'+(need>0?'<small>przy kursie '+lov+' opłaca się od '+Math.round(need*100)+'%</small>':'<small>wpisz kurs na żywo, a kolor pokaże opłacalność</small>')+'</div>';
      mpEl.classList.remove('g','ylw','rd');mpEl.classList.add(mpCls)}
    var exp1h=prior*0.45,rt1=exp1h>0?obs/exp1h:0;
    setT('.tp',obs>0?('x'+rt1.toFixed(2)+(rt1<0.75?' (wolniejsze)':(rt1>1.25?' (szybsze)':' (normalne)'))):'brak danych');


    var pn=1-Math.exp(-tot*mom*(rem0>0?rem/rem0:1)*(F(Math.min(90,m+15))-Fm));
    var total=s1+s2;
    var lab=total==0?'Gol do końca meczu (powyżej 0,5)':'Kolejny gol (powyżej '+(total+0.5)+')';
    var h=row('Oczekiwane gole do końca meczu',rem.toFixed(2))+(cb?row('Przed uczeniem się',(pb*100).toFixed(1)+'%')+row('Nauka na podstawie (liczba meczów)',NLEARN):'')+(pb!==pg?row('Sam model Poissona',(pg*100).toFixed(1)+'%'):'')+(pmk>0?row('Szansa wynikająca z kursów na żywo',(pmk*100).toFixed(1)+'%'):'')+(ps>0?row('Sezonowa częstość goli w 2. połowie',(ps*100).toFixed(0)+'%'):'')+(oddsL>0?row('Gole w meczu wg kursów przed meczem',oddsL.toFixed(2)):'')+row('Gol w pierwszych 15 min 2. połowy',(pn*100).toFixed(1)+'%')+(pk1n+pk2n>0?row('xG po odjęciu karnych (gosp. / goście)',x1.toFixed(2)+' / '+x2.toFixed(2)):'');
    if(alt>0&&mx>0&&Math.abs(alt-mx)>0.4*Math.max(mx,0.5)){h+='<div class="bad">xG z 1. połowy ('+fmt(mx)+') i dane o strzałach ('+alt.toFixed(2)+') mocno się różnią: sprawdź źródło xG.</div>'}
    if(reds>0){h+=row('Wpływ czerwonych kartek na tempo goli','gospodarze x'+(Math.pow(0.75,r1n)*Math.pow(1.25,r2n)).toFixed(2)+', goście x'+(Math.pow(0.75,r2n)*Math.pow(1.25,r1n)).toFixed(2))}
    
    
    
    
    if(ad>=1){h+=row('Wpływ stanu gry na tempo goli','gospodarze x'+gH.toFixed(2)+', goście x'+gA.toFixed(2))}
    if(H.A.n||H.B.n){var hp=[];if(H.A.n)hp.push(esc(q('.n1').value||'Gospodarze')+' '+H.A.g+'/'+H.A.n);if(H.B.n)hp.push(esc(q('.n2').value||'Goście')+' '+H.B.g+'/'+H.B.n);h+=row('Twoje mecze: gole w 2. połowie',hp.join(', '))}
    q('.gr').innerHTML=h;
    var lm=Math.min(89,Math.max(0,num(q('.lm').value))),lres=q('.lres');box.dataset.lp='';
    if(lm>45){
      var base70=rem*(1-cum2(lm)),baseSoFar=rem*cum2(lm);
      var lp1n=Math.max(0,Math.floor(num(q('.lp1').value))),lp2n=Math.max(0,Math.floor(num(q('.lp2').value)));
      var lxa=Math.max(0,num(q('.lx1').value)-0.76*lp1n),lxb=Math.max(0,num(q('.lx2').value)-0.76*lp2n);
      var ox=lxa+lxb;
      var oalt=0.30*(num(q('.lst1').value)+num(q('.lst2').value))+0.03*(num(q('.lco1').value)+num(q('.lco2').value))+0.35*(num(q('.lbc1').value)+num(q('.lbc2').value));
      var obs2=ox>0?(oalt>0?0.75*ox+0.25*oalt:ox):oalt;
      var haveData=(q('.lx1').value!==''||q('.lx2').value!==''||oalt>0);
      var ratio=haveData?(obs2+0.3)/(baseSoFar+0.3):1;
      var mom2=haveData?Math.min(1.5,Math.max(0.6,1+0.6*(ratio-1))):1;
      var lr1=Math.floor(num(q('.lr1').value)),lr2=Math.floor(num(q('.lr2').value));
      var shH=rem>0?lamH/rem:0.5;
      var redF=shH*Math.pow(0.75,lr1)*Math.pow(1.25,lr2)+(1-shH)*Math.pow(0.75,lr2)*Math.pow(1.25,lr1);
      var lam70=base70*mom2*redF*1.12,p70=1-Math.exp(-lam70);
      var mo=num(q('.mo').value),mu=num(q('.mu').value),pm7=0;
      if(mo>1&&mu>1)pm7=(1/mo)/(1/mo+1/mu);else if(mo>1)pm7=Math.min(0.98,(1/mo)/1.05);
      var lg7=function(x){x=Math.min(0.995,Math.max(0.005,x));return Math.log(x/(1-x))};
      var fv2=[lg7(p70),haveData?Math.max(-1,Math.min(1,ratio-1)):0,pm7>0?lg7(pm7):lg7(p70)],p70c=predL(fv2);
      var pct=(p70c*100).toFixed(0),why=(!haveData?'Brak danych z 2. połowy, wynik opiera się na modelu z przerwy.':(ratio<0.7?'Tempo od przerwy było wolne.':(ratio>1.3?'Tempo od przerwy było szybkie.':'Tempo od przerwy było normalne.')))+(lr1+lr2>0?' Czerwone kartki zmieniły tempo gry.':'');
      var needL=mo>1?1/mo:0,hi7=needL>0?needL+0.03:0.55,lo7=needL>0?needL-0.03:0.45;
      var vcl=p70c>=hi7?'vg':(p70c<=lo7?'vr':'vy');
      var vdv='<div class="vd '+vcl+'">'+(p70c>=hi7?'Duża szansa na gola ('+pct+'%): trzymaj zakład':(p70c<=lo7?'Mała szansa na gola ('+pct+'%): wycofaj zakład':'Granica ('+pct+'%): decyzja zależy od oferty cash-out'))+'<small>'+why+'</small></div>';
      var lh=vdv+row('Oczekiwane gole od minuty '+(Math.round(lm)+1)+' do końca',lam70.toFixed(2));
      if(haveData)lh+=row('Tempo od przerwy w porównaniu z oczekiwanym','x'+ratio.toFixed(2)+(ratio<0.7?' (wolne)':(ratio>1.3?' (szybkie)':' (normalne)')));
      if(lp1n+lp2n>0)lh+=row('xG z 2. połowy po odjęciu karnych (gosp. / goście)',lxa.toFixed(2)+' / '+lxb.toFixed(2));
      lh+=row('Gol od minuty '+(Math.round(lm)+1)+' do końca',(p70c*100).toFixed(1)+'%'+ciTxt(ciLT(fv2)),'big')+row('Uczciwy kurs',p70c>0.0005?(1/p70c).toFixed(2):'-');
      if(pm7>0)lh+=row('Szansa wg samego modelu',(p70*100).toFixed(1)+'%')+row('Szansa wg kursów na żywo',(pm7*100).toFixed(1)+'%');
      else if(NLEARNL>0)lh+=row('Surowy model',(p70*100).toFixed(1)+'%');
      if(NLEARNL>0)lh+=row('Nauka na podstawie (liczba sprawdzeń)',NLEARNL);
      if(pm7>0&&Math.abs(p70-pm7)>0.15)lh+='<div class="bad">Model i rynek mocno się różnią ('+(p70*100).toFixed(0)+'% wobec '+(pm7*100).toFixed(0)+'%): rynek zwykle wie więcej, sprawdź skład i przebieg meczu.</div>';
      lh+='<p class="lnote" style="margin-top:6px">To szacunek modelu, a nie porada. '+(needL>0?'Progi wynikają z kursu na żywo: 1 podzielone przez kurs, plus minus 3 punkty procentowe.':'Bez kursu na żywo: zielony od 55%, czerwony do 45%, żółty pomiędzy (to przybliżone progi).')+' To nie jest porada, porównaj z ofertą cash-out.</p>';
      lres.innerHTML=lh;box.dataset.lp=p70;box.dataset.lf=JSON.stringify(fv2);box.dataset.lmin=Math.round(lm);
    }else lres.innerHTML='<p class="lnote">Wpisz minutę (od 46 do 89), aby zobaczyć szansę na gola do końca meczu.</p>';
    var ws=[],nv=function(sel){return num(q(sel).value)};
    if(x1raw>4||x2raw>4)ws.push('xG pierwszej połowy ('+fmt(x1raw)+' / '+fmt(x2raw)+') wygląda na za duże. Czy to nie literówka, np. 1,2 zamiast 12?');
    if(s1+s2>=4&&x1raw+x2raw<0.8)ws.push('W przerwie jest '+(s1+s2)+' goli lub więcej przy bardzo niskim xG: sprawdź wynik i xG.');
    if(s1>6||s2>6)ws.push('Wynik w przerwie wygląda na zbyt wysoki: sprawdź, czy to nie pomyłka.');
    if((ov>0&&ov<=1)||(un>0&&un<=1))ws.push('Kurs przed meczem musi być większy niż 1.');
    if(ov>1&&un>1){var ovr=1/ov+1/un;if(ovr>1.15)ws.push('Kursy Over i Under dają sumę szans '+Math.round(ovr*100)+'% (marża ok. '+Math.round((ovr-1)*100)+'%). To dużo: sprawdź, czy oba są z rynku 2,5 gola.');else if(ovr<1)ws.push('Kursy Over i Under dają sumę szans poniżej 100%: wyglądają na pomylone albo z różnych rynków.')}
    if((ov>1)!==(un>1)&&(ov>0||un>0))ws.push('Wpisałeś tylko jeden kurs Over/Under. Kalkulator odejmie typową marżę, ale dokładniej będzie z obydwoma.');
    var lo1=nv('.lo'),lu1=nv('.lu');
    if((lo1>0&&lo1<=1)||(lu1>0&&lu1<=1))ws.push('Kurs na żywo musi być większy niż 1.');
    if(lo1>1&&lu1>1&&(1/lo1+1/lu1)>1.2)ws.push('Marża kursów na żywo jest wysoka (ok. '+Math.round((1/lo1+1/lu1-1)*100)+'%): sprawdź kursy.');
    if(r1n>3||r2n>3)ws.push('Ponad 3 czerwone kartki dla jednej drużyny? Sprawdź.');
    if(nv('.sth')+nv('.sta')>35||nv('.bch')+nv('.bca')>10)ws.push('Dane o strzałach lub wielkich szansach wyglądają na za duże: sprawdź.');
    if(pk1n*0.76>x1raw+0.001||pk2n*0.76>x2raw+0.001)ws.push('Karne razy 0,76 dają więcej, niż wynosi xG drużyny. Sprawdź liczbę karnych albo xG (xG ustawiono na 0).');
    var lpa=Math.floor(nv('.lp1')),lpb=Math.floor(nv('.lp2'));
    if(lpa*0.76>nv('.lx1')+0.001||lpb*0.76>nv('.lx2')+0.001)ws.push('Nowe karne razy 0,76 dają więcej, niż wynosi xG drugiej połowy tej drużyny. Sprawdź liczbę karnych albo xG (xG ustawiono na 0).');
    var lmv=nv('.lm');
    if(q('.lm').value!==''&&(lmv<46||lmv>89))ws.push('Minuta sprawdzenia powinna być od 46 do 89.');
    if(nv('.lx1')+nv('.lx2')>3)ws.push('xG drugiej połowy powyżej 3 w kilkadziesiąt minut? Sprawdź dane.');
    q('.wrn').innerHTML=ws.map(function(w){return '<p>'+esc(w)+'</p>'}).join('');
    box.dataset.pg=pb;box.dataset.m=m;box.dataset.sc=s1+'-'+s2;box.dataset.f=JSON.stringify(fv);box.dataset.mx=mx;box.dataset.ov=ov;box.dataset.un=un;box.dataset.rd=reds;
  }
  box.addEventListener('input',run);
  
  q('.sv').onclick=function(){var pg=parseFloat(box.dataset.pg);if(isNaN(pg))return;var f=null;try{f=JSON.parse(box.dataset.f)}catch(e){}LOG.push({t:Date.now(),h:q('.n1').value||'Gospodarze',a:q('.n2').value||'Goście',n:(q('.n1').value||'Gospodarze')+' - '+(q('.n2').value||'Goście'),m:45,sc:box.dataset.sc,p:pg,f:f,mx:+box.dataset.mx,ov:+box.dataset.ov,un:+box.dataset.un,rd:+box.dataset.rd,o:null});saveLog();renderLog();setMsg('Zapisano: '+LOG[LOG.length-1].n);var b=this;b.textContent='Zapisano';setTimeout(function(){b.textContent='Zapisz prognozę'},1200)};
  var swT0=0,swFrom=45,swTimer=null;

    q('.swdisp').textContent=mm+':'+(ss<10?'0':'')+ss;

  }

    saveLog();renderLog();setMsg('Zapisano sprawdzenie: '+LOG[LOG.length-1].n);
    var b=this;b.textContent='Zapisano';setTimeout(function(){b.textContent='Zapisz sprawdzenie'},1200)};
  q('.reset').onclick=function(){box.querySelectorAll('input').forEach(function(i){i.value=''});run()};
  run();
  list.appendChild(box);
}
