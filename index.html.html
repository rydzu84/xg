<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kalkulator xG</title>
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --page:#c4b0f8; --head:#0b6fd6; --headtx:#fff;
  --name:#b5f5c3; --label:#7a2e0e; --labeltx:#fff;
  --input:#fde6cf; --cell:#fff; --yellow:#fde68a; --green:#7ed321;
  --tx:#111; --line:#fff; --red:#b3141c;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --page:#2b2150; --cell:#e9e6f5; --input:#e8cdb4; --name:#9ad9a8; --yellow:#e5cf74; --green:#6fb81f;
  }
}
:root[data-theme="dark"]{
  --page:#2b2150; --cell:#e9e6f5; --input:#e8cdb4; --name:#9ad9a8; --yellow:#e5cf74; --green:#6fb81f;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--page);color:var(--tx);font:13px/1.2 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;padding:12px}
.wrap{max-width:1000px;margin:0 auto}
.scroll{overflow-x:auto;max-width:100%}
table{border-collapse:separate;border-spacing:1px;min-width:900px;width:100%}
th{background:var(--head);color:var(--headtx);font-weight:600;font-size:10px;padding:5px 3px;text-align:center}
td{background:var(--cell);text-align:center;height:34px;padding:0;font-size:12px}
td.lab{background:var(--label);color:var(--labeltx);font-size:11px;width:68px}
td.nm{background:var(--name);width:190px}
td.in{background:var(--input)}
td.y{background:var(--yellow)}
td.g{background:var(--green);font-weight:600}
td.b{font-weight:700}
td.res{background:var(--yellow);font-weight:600;font-size:11px;line-height:1.5}
input{width:100%;height:100%;box-sizing:border-box;border:0;background:transparent;text-align:center;font:inherit;color:#111;padding:6px 4px}
td.nm input{text-align:left;padding-left:8px}
.bar{display:flex;justify-content:flex-end;gap:6px;margin:6px 0 4px}
button{border:0;font:inherit;font-size:11px;padding:7px 12px;cursor:pointer;color:#fff;background:var(--red)}
button.reset{background:#fde68a;color:#111}
button.add{background:var(--head);font-size:13px;padding:10px 16px;margin-top:10px}
button:focus-visible,input:focus-visible{outline:2px solid var(--head);outline-offset:1px}
.gp{background:var(--cell);color:#111;margin-top:6px;padding:10px}
.gh{font-weight:700;margin-bottom:8px}
.gg{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.gp label{display:block;font-size:11px;color:#444;margin-bottom:2px}
.gp input{background:var(--input);height:auto;border:1px solid #fff;padding:8px;text-align:center;color:#111}
.gr{margin-top:10px}
.gr div{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-top:1px solid #ccc;font-size:13px}
.gr .big{font-weight:700;font-size:16px}
.gr .ok{color:#0a7a2f;font-weight:700}
.gr .bad{color:#b3141c}
details{margin-top:8px}
summary{cursor:pointer;font-size:12px;color:#333;margin-bottom:6px}
.bar2{margin-top:8px}
.sv{background:var(--head)}
.lb{background:var(--head);margin-left:4px;padding:4px 8px}
.lb.yes{background:#1f9d57}
.lb.no{background:#d93025}
.lb.xx{background:#777}
.gr div.rg{background:#d6f3e1;border-left:5px solid #1f9d57;padding-left:8px}
.gr div.rn{background:#fadcd9;border-left:5px solid #d93025;padding-left:8px}
.bd{font-weight:700;color:#fff;padding:3px 12px;border-radius:12px;font-size:12px}
.bd.g{background:#1f9d57}
.bd.n{background:#d93025}
.lnote{font-size:12px;color:#444;margin:0 0 8px}
.logbox{margin-top:14px}
.gr .bb{border-top:0;padding:0 0 4px}
.bars{display:flex;flex-direction:column;gap:2px;width:100%}
.bars i{display:block;height:6px}
.bp{background:#0b6fd6}
.ba{background:#12803a}
#csvbox{display:none;width:100%;box-sizing:border-box;height:90px;margin-top:6px;font:11px monospace}
#dl,#dl2,#imp{background:var(--head)}
input{font-size:16px}
.mt{display:grid;grid-template-columns:52px 1fr 64px 68px;gap:1px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;margin-top:6px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;margin-top:6px}
.hd{background:var(--head);color:var(--headtx);font-weight:600;font-size:10px;padding:6px 2px;text-align:center;display:flex;align-items:center;justify-content:center}
.lab{background:var(--label);color:var(--labeltx);font-size:11px;display:flex;align-items:center;justify-content:center}
.nm{background:var(--name)}
.in{background:var(--input)}
.mt input{padding:13px 6px;height:auto;border:0;background:transparent;color:#111}
.mt .nm input{text-align:left;padding-left:8px}
.cl{background:var(--cell);color:#111;text-align:center;padding:12px 2px;font-size:14px;min-height:20px;display:flex;align-items:center;justify-content:center}
.cl.b{font-weight:700}
.cl.y{background:var(--yellow)}
.cl.g{background:var(--green);font-weight:600}
.wc{margin-top:6px}
.wc .rs{background:var(--yellow);color:#111;font-weight:600;text-align:center;padding:12px 4px;font-size:15px}
.gp input{font-size:16px}
.gb{display:grid;grid-template-columns:1fr 1fr 1fr;gap:1px;margin-top:6px}
.gb2{grid-template-columns:1fr 2fr}
.sp2{grid-row:span 2}
.gb .rs{background:var(--yellow);color:#111;font-weight:600;text-align:center;padding:12px 4px;font-size:15px;display:flex;align-items:center;justify-content:center}
@media (min-width:600px) and (max-width:899px){.wrap{max-width:680px}}
@media (min-width:900px){
  .wrap{max-width:1180px}
  #list>div{display:grid;grid-template-columns:minmax(400px,460px) 1fr;gap:8px 18px;align-items:start}
  #list>div>.mt,#list>div>.gb{grid-column:1;margin-top:0}
  #list>div>.gp{grid-column:2;grid-row:1 / span 5;margin-top:0}
  #list>div>.bar{grid-column:1}
}
.late{margin-top:16px;border-top:2px solid #ccc;padding-top:12px}
.gr .vd{display:block;text-align:center;font-weight:700;font-size:16px;padding:14px;border-radius:8px;color:#fff;margin:8px 0;border-top:0}
.gr .vg{background:#1f9d57}
.gr .vr{background:#d93025}
.gr .vy{background:#f0b429;color:#111}
.gr .vd small{display:block;font-weight:400;font-size:13px;margin-top:5px}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}
.fbtn{display:inline-block;font-size:11px;padding:7px 12px;cursor:pointer;color:#fff;background:var(--head)}
#pst{display:block;width:100%;box-sizing:border-box;height:100px;margin:6px 0;font-size:16px;text-align:left}
</style>
</head>
<body>
<div class="wrap">
  <div id="list"></div>
  
  <div class="gp logbox"><div class="gh">Mecze i uczenie się</div><div id="msg" class="lnote"></div><div id="cnt"></div><div id="cal"></div><div class="gh" style="margin-top:12px">Zapisane mecze</div><div id="lg"></div><div class="gh" style="margin-top:14px">Sprawdzenia z 70. minuty (gol od 71. minuty)</div><div id="lcnt"></div><div id="llg"></div><div class="bar"><button id="dl">Zapisz mecze do pliku</button><label class="fbtn" for="impf">Wczytaj mecze z pliku</label><input type="file" id="impf" class="vh"><button class="rm" id="clr">Wyczyść wszystko</button></div><textarea id="csvbox" readonly aria-label="Mecze jako tekst CSV"></textarea><div id="msg2" class="lnote"></div><details id="pasteBox"><summary>Nie działa wczytywanie z pliku? Wklej tekst</summary><textarea id="pst" placeholder="Wklej tu całą zawartość pliku z meczami"></textarea><button id="pbtn">Wczytaj z wklejonego tekstu</button></details></div>
</div>
<script>
var list=document.getElementById('list');
var LOG=[],DB=null,UID=null,busy=false,again=false,SYN={};
function setMsg(t){var m=document.getElementById('msg'),m2=document.getElementById('msg2');if(m)m.textContent=t;if(m2)m2.textContent=t}
try{LOG=JSON.parse(localStorage.getItem('xglog')||'[]')}catch(e){LOG=[]}
function saveLog(){
  try{localStorage.setItem('xglog',JSON.stringify(LOG))}catch(e){}
  if(!DB||!UID)return;
  if(busy){again=true;return}
  busy=true;
  var col=DB.collection('data/users/'+UID),ops=[],keys={};
  LOG.forEach(function(e){
    var k='m_'+e.t,j=JSON.stringify(e);keys[k]=1;
    if(SYN[k]!==j)ops.push(col.doc(k).set(JSON.parse(j)).then(function(){SYN[k]=j}));
  });
  Object.keys(SYN).forEach(function(k){
    if(!keys[k])ops.push(col.doc(k).delete().then(function(){delete SYN[k]}));
  });
  Promise.all(ops).catch(function(){setMsg('Nie udało się zsynchronizować z kontem, zapisano tylko na tym urządzeniu')}).then(function(){busy=false;if(again){again=false;saveLog()}});
}
var P0=[0,1,0,0,0,0,0],TH=P0.slice(),NLEARN=0;
function sg(x){return 1/(1+Math.exp(-x))}
function R(a,b,c){return '<div'+(c?' class="'+c+'"':'')+'><span>'+a+'</span><span>'+b+'</span></div>'}
function resolved(){return LOG.filter(function(e){return e.o!==null&&e.k!=='late'})}
function featOf(e){var f=e.f;if(f&&f.length===6)return f;if(f&&f.length===4)return f.concat([0,0]);var p=Math.min(0.999,Math.max(0.001,e.p));return[Math.log(p/(1-p)),0,0,0,0,0]}
function fit(d,iters){
  var th=P0.slice(),lam=4;
  if(!d.length)return th;
  var L=0.25*d.length*10+lam+1,X=d.map(function(e){return[1].concat(featOf(e))}),Y=d.map(function(e){return e.o?1:0});
  for(var it=0;it<iters;it++){
    var g=th.map(function(v,k){return lam*(v-P0[k])});
    for(var i=0;i<X.length;i++){var z=0,k;for(k=0;k<7;k++)z+=th[k]*X[i][k];var r=sg(z)-Y[i];for(k=0;k<7;k++)g[k]+=r*X[i][k]}
    for(var j=0;j<7;j++)th[j]-=g[j]/L;
  }
  return th;
}
var PL=[0,0.5,0,0.5],TL=PL.slice(),NLEARNL=0;
function resolvedL(){return LOG.filter(function(e){return e.o!==null&&e.k==='late'})}
function featL(e){var f=e.f;if(f&&f.length===3)return f;if(f&&f.length===2)return[f[0],f[1],f[0]];var p=Math.min(0.999,Math.max(0.001,e.p)),l=Math.log(p/(1-p));return[l,0,l]}
function fitL(d,iters){
  var th=PL.slice(),lam=4;
  if(!d.length)return th;
  var L=0.25*d.length*5+lam+1,X=d.map(function(e){return[1].concat(featL(e))}),Y=d.map(function(e){return e.o?1:0});
  for(var it=0;it<iters;it++){
    var g=th.map(function(v,k){return lam*(v-PL[k])});
    for(var i=0;i<X.length;i++){var z=0,k;for(k=0;k<4;k++)z+=th[k]*X[i][k];var r=sg(z)-Y[i];for(k=0;k<4;k++)g[k]+=r*X[i][k]}
    for(var j=0;j<4;j++)th[j]-=g[j]/L;
  }
  return th;
}
function predL(f){return sg(TL[0]+TL[1]*f[0]+TL[2]*f[1]+TL[3]*f[2])}
function train(){var d=resolved();NLEARN=d.length;TH=fit(d,300);var dl=resolvedL();NLEARNL=dl.length;TL=fitL(dl,300)}
function pred(th,f){var z=th[0];for(var k=0;k<6;k++)z+=th[k+1]*f[k];return sg(z)}
function predict(f){return pred(TH,f)}
function nrm(s){return String(s||'').trim().toLowerCase()}
function teamsOf(e){if(e.h!==undefined)return[nrm(e.h),nrm(e.a)];var p=String(e.n||'').split(' - ');return[nrm(p[0]),nrm(p[1])]}
function hist(n1,n2){
  var a=nrm(n1),b=nrm(n2),A={n:0,g:0},B={n:0,g:0},T={n:0,g:0};
  resolved().forEach(function(e){
    var t=teamsOf(e),ia=a&&(t[0]===a||t[1]===a),ib=b&&(t[0]===b||t[1]===b);
    if(ia){A.n++;if(e.o)A.g++}
    if(ib){B.n++;if(e.o)B.g++}
    if(ia||ib){T.n++;if(e.o)T.g++}
  });
  return{A:A,B:B,T:T};
}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function descr(e){var m=e.m||(e.k==='late'?70:45);if(e.o===null)return 'Czeka na wynik';if(e.k==='late')return e.o?'Gol pad\u0142 od '+m+'. minuty lub p\u00f3\u017aniej':'Brak gola od '+m+'. minuty do ko\u0144ca meczu';return e.o?'Gol pad\u0142 w drugiej po\u0142owie':'Brak gola w drugiej po\u0142owie'}
function csv(kind){
  var rows=[['data','mecz','minuta','wynik_w_przerwie','xg_pierwsza_polowa','kurs_over25','kurs_under25','czerwone_kartki','szansa_modelu_procent','gol_w_2_polowie','rodzaj','opis_wyniku']];
  LOG.filter(function(e){return kind==='all'||(kind==='late'?e.k==='late':e.k!=='late')}).forEach(function(e){rows.push([new Date(e.t).toISOString().slice(0,10),e.n,e.m,e.sc,e.mx!=null?e.mx:'',e.ov||'',e.un||'',e.rd||0,(e.p*100).toFixed(1),e.o===null?'':(e.o?'tak':'nie'),e.k==='late'?'70min':'przerwa',descr(e)])});
  return '\ufeff'+rows.map(function(r){return r.map(function(c){return '"'+String(c).replace(/"/g,'""')+'"'}).join(',')}).join('\n');
}
function renderLog(){
  train();
  var done=resolved(),G=done.filter(function(e){return e.o}).length;
  document.getElementById('cnt').innerHTML='<div class="gr">'+R('Zapisane mecze',LOG.filter(function(e){return e.k!=='late'}).length)+R('Z wynikiem',done.length)+R('Gol w 2. połowie',done.length?G+' z '+done.length+' ('+Math.round(G/done.length*100)+'%)':'-')+R('Uczenie się',done.length?'włączone (liczba meczów: '+done.length+')':'zacznie się po pierwszym wyniku')+'</div>';
  var cal='';
  if(done.length){
    var B=[[0,0.5],[0.5,0.6],[0.6,0.7],[0.7,0.8],[0.8,1.01]],rows='';
    B.forEach(function(b){
      var x=done.filter(function(e){return e.p>=b[0]&&e.p<b[1]});
      if(x.length){
        var pr=x.reduce(function(a,e){return a+e.p},0)/x.length*100,hit=x.filter(function(e){return e.o}).length/x.length*100;
        rows+=R(Math.round(b[0]*100)+'-'+Math.min(100,Math.round(b[1]*100))+'% ('+x.length+' meczów)','przewidziano '+pr.toFixed(0)+'%, faktycznie '+hit.toFixed(0)+'%')+'<div class="bb"><span class="bars"><i class="bp" style="width:'+pr.toFixed(0)+'%"></i><i class="ba" style="width:'+hit.toFixed(0)+'%"></i></span></div>';
      }
    });
    cal='<div class="gh" style="margin-top:12px">Czy model jest trafny?</div><p class="lnote">Niebieski pasek: co przewidział model. Zielony pasek: jak często gol naprawdę padł.</p><div class="gr">'+rows+'</div>';
    if(done.length>=5){
      var s0=Math.max(0,done.length-120),br=0,bl=0,n=0;
      for(var q=s0;q<done.length;q++){
        var y=done[q].o?1:0,th=fit(done.slice(Math.max(0,q-150),q),80);
        br+=Math.pow(done[q].p-y,2);bl+=Math.pow(pred(th,featOf(done[q]))-y,2);n++;
      }
      var rt=G/done.length;
      cal+='<div class="gr">'+R('Wynik Brier, model surowy (im niższy, tym lepiej)',(br/n).toFixed(3))+R('Wynik Brier, po uczeniu się (na nowych meczach)',(bl/n).toFixed(3))+R('Wynik Brier, zawsze zgadując średnią',(rt*(1-rt)).toFixed(3))+'</div><p class="lnote">Model ma sens tylko wtedy, gdy jego wynik jest niższy niż linia „zawsze zgadując średnią”.</p>';
    }
  }else cal='<p class="lnote">Zapisz mecz w przerwie, a po meczu zaznacz, czy w 2. połowie padł gol. Kalkulator uczy się z każdego wyniku.</p>';
  document.getElementById('cal').innerHTML=cal;
  function mrow(e,i){
    return '<div'+(e.o===null?'':(e.o?' class="rg"':' class="rn"'))+'><span>'+esc(e.n)+(e.k==='late'?' \u00b7 min. '+e.m:'')+'</span><span>'+(e.o===null?'<button class="lb yes" data-i="'+i+'" data-a="1">Tak, gol</button><button class="lb no" data-i="'+i+'" data-a="0">Brak gola</button>':(e.o?'<span class="bd g">Gol</span>':'<span class="bd n">Brak gola</span>'))+'<button class="lb xx" data-i="'+i+'" data-a="x">x</button></span></div>';
  }
  var lp='',lf='',nf=0;
  for(var i=LOG.length-1;i>=0;i--){
    if(LOG[i].k==='late')continue;if(LOG[i].o===null)lp+=mrow(LOG[i],i);else{lf+=mrow(LOG[i],i);nf++}
  }
  document.getElementById('lg').innerHTML=(lp?'<div class="gr">'+lp+'</div>':'<p class="lnote">Brak meczów czekających na wynik.</p>')+(nf?'<details id="fin"'+(FIN?' open':'')+'><summary>Zakończone mecze ('+nf+')</summary><div class="gr">'+lf+'</div></details>':'');
  var dl2=resolvedL(),GL=dl2.filter(function(e){return e.o}).length,ln=LOG.filter(function(e){return e.k==='late'}).length;
  var lc='<div class="gr">'+R("Zapisane sprawdzenia z 70. minuty",ln)+R('Z wynikiem',dl2.length)+R('Gol po sprawdzeniu',dl2.length?GL+' z '+dl2.length+' ('+Math.round(GL/dl2.length*100)+'%)':'-')+R('Uczenie się',dl2.length?'włączone (liczba sprawdzeń: '+dl2.length+')':'zacznie się po pierwszym wyniku');
  if(dl2.length){var pa=dl2.reduce(function(a,e){return a+e.p},0)/dl2.length*100;lc+=R('Średnia szansa modelu a rzeczywistość',pa.toFixed(0)+'% vs '+Math.round(GL/dl2.length*100)+'% faktycznie')}
  document.getElementById('lcnt').innerHTML=lc+'</div>';
  var lp2='',lf2='',nf2=0;
  for(var i2=LOG.length-1;i2>=0;i2--){if(LOG[i2].k!=='late')continue;if(LOG[i2].o===null)lp2+=mrow(LOG[i2],i2);else{lf2+=mrow(LOG[i2],i2);nf2++}}
  document.getElementById('llg').innerHTML=(lp2?'<div class="gr">'+lp2+'</div>':'<p class="lnote">Brak sprawdzeń czekających na wynik.</p>')+(nf2?'<details id="finl"'+(FINL?' open':'')+'><summary>Zakończone sprawdzenia z 70. minuty ('+nf2+')</summary><div class="gr">'+lf2+'</div></details>':'');
  var bs=document.querySelectorAll('#list>div');
  for(var j=0;j<bs.length;j++)bs[j].dispatchEvent(new Event('input'));
}
var FIN=false;
document.getElementById('lg').addEventListener('toggle',function(ev){if(ev.target.id==='fin')FIN=ev.target.open},true);
var FINL=false;
var onLogClick=function(e){var t=e.target;if(t.dataset&&t.dataset.i!==undefined){var i=+t.dataset.i;if(t.dataset.a==='x')LOG.splice(i,1);else LOG[i].o=t.dataset.a==='1';saveLog();renderLog()}};
document.getElementById('lg').onclick=onLogClick;
document.getElementById('llg').onclick=onLogClick;
document.getElementById('llg').addEventListener('toggle',function(ev){if(ev.target.id==='finl')FINL=ev.target.open},true);
var clrT=0;
document.getElementById('clr').onclick=function(){var b=this;if(!clrT){clrT=setTimeout(function(){clrT=0;b.textContent='Wyczyść wszystko'},3000);b.textContent='Stuknij ponownie, aby potwierdzić';return}clearTimeout(clrT);clrT=0;b.textContent='Wyczyść wszystko';LOG=[];saveLog();renderLog()};
async function exportCsv(kind,fname){
  if(!LOG.some(function(e){return kind==='all'||(kind==='late'?e.k==='late':e.k!=='late')})){setMsg('Nie ma jeszcze nic do zapisania');return}
  var t=csv(kind);
  try{var dd=await claude.use('downloads');if(dd){await dd.save({filename:fname,data:t});return}}catch(e){if(e&&e.code==='declined')return}
  var bx=document.getElementById('csvbox');bx.style.display='block';bx.value=t;bx.select();
}
document.getElementById('dl').onclick=function(){exportCsv('all','xg-matches.csv')};
function detectDelim(t){var h=t.split(/\r?\n/)[0]||'';var sc=(h.match(/;/g)||[]).length,cm=(h.match(/,/g)||[]).length,tb=(h.match(/\t/g)||[]).length;return tb>cm&&tb>sc?'\t':(sc>cm?';':',')}

    LOG.push({t:Date.now(),k:'late',n:(q('.n1').value||'Gospodarze')+' - '+(q('.n2').value||'Goście'),h:q('.n1').value||'Gospodarze',a:q('.n2').value||'Goście',m:+box.dataset.lmin||70,sc:box.dataset.sc,p:lp,f:f,mx:+box.dataset.mx,ov:+box.dataset.ov,un:+box.dataset.un,rd:+box.dataset.rd,o:null});
    saveLog();renderLog();setMsg('Zapisano sprawdzenie z 70. minuty: '+LOG[LOG.length-1].n);
    var b=this;b.textContent='Zapisano';setTimeout(function(){b.textContent='Zapisz sprawdzenie z 70. minuty'},1200)};
  q('.reset').onclick=function(){box.querySelectorAll('input').forEach(function(i){i.value=''});run()};
  run();
  list.appendChild(box);
}
make();

</script>
